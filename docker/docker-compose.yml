version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: drdo-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: drdo_recruitment
    volumes:
      - mongodb_data:/data/db
    networks:
      - drdo-network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: drdo-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/drdo_recruitment
      JWT_SECRET: drdo_production_secret_key_change_this
      JWT_EXPIRE: 30d
      NODE_ENV: production
      PORT: 5000
    depends_on:
      - mongodb
    networks:
      - drdo-network

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: drdo-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - drdo-network

  ai-tools:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai
    container_name: drdo-ai
    restart: always
    ports:
      - "8000:8000"
    networks:
      - drdo-network

volumes:
  mongodb_data:

networks:
  drdo-network:
    driver: bridge